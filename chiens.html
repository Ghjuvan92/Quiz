<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz – Chiens</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--orange:#d4601a;--orange-mid:#e8854a;--brown:#7a3b10;--ok:#3a6b2a;--ok-bg:#dff0d4;--ko:#9b2a1a;--ko-bg:#fde8e0;--r:12px;--rs:8px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;color:#fdf6ee;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1.25rem 1rem 2.5rem;
  background:radial-gradient(ellipse 120% 60% at 30% 20%,rgba(196,82,18,0) 0%,#7a3b10 45%,#4a2008 100%),linear-gradient(160deg,#a04010 0%,#6a2e08 40%,#3a1804 100%)}
.nav{width:100%;max-width:540px;display:flex;align-items:center;gap:10px;margin-bottom:1.1rem}
.back{font-size:.8rem;color:rgba(253,246,238,.6);text-decoration:none}.back:hover{color:#fdf6ee}
.hdr{text-align:center;flex:1}
.hdr h1{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:400}
.hdr h1 em{font-style:italic;color:var(--orange-mid)}
.hud-row{display:flex;gap:6px;margin-bottom:.55rem;align-items:center;width:100%;max-width:540px}
.hud-lives{display:flex;gap:4px;margin-left:auto}
.hud-score{font-size:.78rem;color:rgba(253,246,238,.6);white-space:nowrap}
.hud-score strong{color:#fdf6ee;font-weight:500}
.hud-streak{font-size:.78rem;color:var(--orange-mid);font-weight:500}
.prog{height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;margin-bottom:.65rem;width:100%;max-width:540px}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--orange-mid),#f0a060);border-radius:2px;transition:width .4s ease}
.panel{width:100%;max-width:540px}
.qcard{background:rgba(255,255,255,.97);border-radius:var(--r);padding:.7rem 1.1rem .65rem;border:none;margin-bottom:.5rem;position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(42,26,14,.35)}
.qcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brown),var(--orange),var(--orange-mid),var(--orange),var(--brown))}
.qlabel{font-size:.63rem;letter-spacing:.15em;text-transform:uppercase;color:#a07850;margin-bottom:.3rem;font-weight:500}
.animal-wrap{width:100%;height:210px;border-radius:var(--rs);overflow:hidden;margin-bottom:.4rem;background:#e8d5b8;display:flex;align-items:center;justify-content:center}
.animal-img{width:100%;height:100%;object-fit:contain}
.animal-ph{font-size:3rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:.5rem}
.choice{padding:.58rem .75rem;border-radius:var(--rs);border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.78rem;color:#fdf6ee;text-align:center;line-height:1.3;transition:border-color .14s,background .14s;backdrop-filter:blur(4px)}
.choice:not([disabled]):hover{border-color:var(--orange-mid);background:rgba(232,133,74,.25)}
.choice.cor{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:500}
.choice.wrg{background:var(--ko-bg);border-color:var(--ko);color:var(--ko)}
.choice[disabled]{cursor:default}
.fb{border-radius:var(--rs);padding:.65rem .95rem;font-size:.8rem;line-height:1.5;margin-top:.5rem;display:none}
.fb.cor{background:var(--ok-bg);color:var(--ok);display:block}
.fb.wrg{background:var(--ko-bg);color:var(--ko);display:block}
.fb-main{font-weight:500}
.nbtn{width:100%;margin-top:.5rem;padding:10px;border-radius:var(--rs);border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);font-family:'DM Sans',sans-serif;font-size:.84rem;font-weight:500;cursor:pointer;color:rgba(253,246,238,.85);transition:all .18s;display:none}
.nbtn.on{display:block}.nbtn:hover{background:var(--orange);color:white;border-color:var(--orange)}
.end{background:rgba(255,255,255,.97);border-radius:var(--r);box-shadow:0 4px 28px rgba(42,26,14,.4);padding:2.2rem 1.75rem;text-align:center;display:none;position:relative;overflow:hidden;width:100%;max-width:540px}
.end::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brown),var(--orange),var(--orange-mid),var(--orange),var(--brown))}
.end.on{display:block}
.end-eye{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--orange);font-weight:500;margin-bottom:.55rem}
.end-score{font-family:'Playfair Display',serif;font-size:3rem;font-weight:400;color:#2a1a0e;line-height:1}
.end-pct{font-size:.88rem;color:#a07850;margin-top:.4rem}
.end-msg{font-size:.86rem;color:#5c3a1e;margin-top:.55rem}
.rbtn{margin-top:1.4rem;padding:10px 24px;border-radius:40px;background:var(--orange);color:white;border:none;font-family:'DM Sans',sans-serif;font-size:.84rem;font-weight:500;cursor:pointer}
.rbtn:hover{background:var(--brown)}
.share-btn{display:inline-flex;align-items:center;gap:5px;padding:9px 18px;border-radius:40px;background:var(--brown);color:white;border:none;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;cursor:pointer}
.share-toast{font-size:.74rem;color:var(--ok);margin-top:.4rem;min-height:.9rem;text-align:center}
</style>
</head>
<body>
<div class="nav">
  <a class="back" href="index.html">← Accueil</a>
  <div class="hdr"><h1>🐶 <em>Races de chiens</em></h1></div>
</div>
<div class="hud-row">
  <div class="hud-lives" id="hearts"></div>
  <div class="hud-score">Score&thinsp;: <strong id="score">0</strong></div>
  <div class="hud-streak" id="streak"></div>
</div>
<div class="prog"><div class="prog-fill" id="prog" style="width:0%"></div></div>
<div class="panel" id="game">
  <div class="qcard">
    <div class="qlabel">Quelle est cette race de chien ?</div>
    <div class="animal-wrap">
      <div class="animal-ph" id="animal-ph">🐶</div>
      <img id="animal-img" class="animal-img" style="display:none" alt="">
    </div>
  </div>
  <div class="choices" id="choices"></div>
  <div class="fb" id="fb"></div>
  <button class="nbtn" id="nbtn" onclick="nextQ()">Question suivante →</button>
</div>
<div class="end" id="end">
  <div class="end-eye">Partie terminée</div>
  <div class="end-score" id="escore"></div>
  <div class="end-pct" id="epct"></div>
  <div class="end-msg" id="emsg"></div>
  <div style="display:flex;gap:8px;justify-content:center;margin-top:1.4rem">
    <button class="rbtn" onclick="resetGame()">Rejouer</button>
    <button class="share-btn" onclick="doShare()">⬆ Partager</button>
  </div>
  <div class="share-toast" id="toast"></div>
</div>
<script>
const IMGP="photos_chiens/";
const CHIENS=[
  {n:"Akita Américain",jpg:"akita-americain.jpg"},
  {n:"Akita Inu",jpg:"akita-inu.jpg"},
  {n:"American Bully",jpg:"american-bully.jpg"},
  {n:"American Staff",jpg:"american-staff.jpg"},
  {n:"Basenji",jpg:"basenji.jpg"},
  {n:"Basset Hound",jpg:"basset-hound.jpg"},
  {n:"Beagle",jpg:"beagle.jpg"},
  {n:"Beauceron",jpg:"beauceron.jpg"},
  {n:"Berger Allemand",jpg:"berger-allemand.jpg"},
  {n:"Berger Australien",jpg:"berger-australien.jpg"},
  {n:"Berger Belge Malinois",jpg:"berger-belge-malinois.jpg"},
  {n:"Berger d'Anatolie",jpg:"berger-d'anatolie.jpg"},
  {n:"Berger de Brie",jpg:"berger-de-brie.jpg"},
  {n:"Berger des Pyrénées",jpg:"berger-des-pyrenees.jpg"},
  {n:"Berger des Shetland",jpg:"berger-des-shetland.jpg"},
  {n:"Berger du Caucase",jpg:"berger-du-caucase.jpg"},
  {n:"Berger Hollandais",jpg:"berger-hollandais.jpg"},
  {n:"Bichon Frisé",jpg:"bichon-frise.jpg"},
  {n:"Bichon Havanais",jpg:"bichon-havanais.jpg"},
  {n:"Bichon Maltais",jpg:"bichon-maltais.jpg"},
  {n:"Bobtail",jpg:"bobtail.jpg"},
  {n:"Border Collie",jpg:"border-collie.jpg"},
  {n:"Boston Terrier",jpg:"boston-terrier.jpg"},
  {n:"Bouledogue Américain",jpg:"bouledogue-americain.jpg"},
  {n:"Bouledogue Anglais",jpg:"bouledogue-anglais.jpg"},
  {n:"Bouledogue Français",jpg:"bouledogue-francais.jpg"},
  {n:"Bouvier Australien",jpg:"bouvier-australien.jpg"},
  {n:"Bouvier Bernois",jpg:"bouvier-bernois.jpg"},
  {n:"Boxer",jpg:"boxer.jpg"},
  {n:"Braque Allemand",jpg:"braque-allemand.jpg"},
  {n:"Braque de Weimar",jpg:"braque-de-weimar.jpg"},
  {n:"Bull Terrier",jpg:"bull-terrier.jpg"},
  {n:"Bullmastiff",jpg:"bullmastiff.jpg"},
  {n:"Cairn Terrier",jpg:"cairn-terrier.jpg"},
  {n:"Cane Corso",jpg:"cane-corso.jpg"},
  {n:"Caniche Nain",jpg:"caniche-nain.jpg"},
  {n:"Carlin",jpg:"carlin.jpg"},
  {n:"Cavalier King Charles",jpg:"cavalier-king-charles.jpg"},
  {n:"Chien Loup Tchécoslovaque",jpg:"chien-loup-tchecoslovaque.jpg"},
  {n:"Chihuahua",jpg:"chihuahua.jpg"},
  {n:"Chow Chow",jpg:"chow-chow.jpg"},
  {n:"Cocker Américain",jpg:"cocker-americain.jpg"},
  {n:"Cocker Spaniel",jpg:"cocker-spaniel.jpg"},
  {n:"Colley",jpg:"colley.jpg"},
  {n:"Coton de Tuléar",jpg:"coton-de-tulear.jpg"},
  {n:"Dalmatien",jpg:"dalmatien.jpg"},
  {n:"Dobermann",jpg:"dobermann.jpg"},
  {n:"Dogue Allemand",jpg:"dogue-allemand.jpg"},
  {n:"Dogue Argentin",jpg:"dogue-argentin.jpg"},
  {n:"Dogue de Bordeaux",jpg:"dogue-de-bordeaux.jpg"},
  {n:"Dogue du Tibet",jpg:"dogue-du-tibet.jpg"},
  {n:"Épagneul Breton",jpg:"epagneul-breton.jpg"},
  {n:"Eurasier",jpg:"eurasier.jpg"},
  {n:"Fox Terrier",jpg:"fox-terrier.jpg"},
  {n:"Golden Retriever",jpg:"golden-retriever.jpg"},
  {n:"Husky Sibérien",jpg:"husky-siberien.jpg"},
  {n:"Jack Russell",jpg:"jack-russell.jpg"},
  {n:"Labrador Retriever",jpg:"labrador-retriever.jpg"},
  {n:"Leonberg",jpg:"leonberg.jpg"},
  {n:"Lhassa Apso",jpg:"lhassa-apso.jpg"},
  {n:"Mastiff",jpg:"mastiff.jpg"},
  {n:"Pékinois",jpg:"pekinois.jpg"},
  {n:"Pinscher Nain",jpg:"pinscher-nain.jpg"},
  {n:"Pinscher",jpg:"pinscher.jpg"},
  {n:"Pitbull",jpg:"pitbull.jpg"},
  {n:"Pointer",jpg:"pointer.jpg"},
  {n:"Pomsky",jpg:"pomsky.jpg"},
  {n:"Rhodesian Ridgeback",jpg:"rhodesian-ridgeback.jpg"},
  {n:"Rottweiler",jpg:"rottweiler.jpg"},
  {n:"Saint-Bernard",jpg:"saint-bernard.jpg"},
  {n:"Samoyède",jpg:"samoyede.jpg"},
  {n:"Setter Anglais",jpg:"setter-anglais.jpg"},
  {n:"Setter Irlandais",jpg:"setter-irlandais.jpg"},
  {n:"Shar Peï",jpg:"shar-peï.jpg"},
  {n:"Shiba Inu",jpg:"shiba-inu.jpg"},
  {n:"Shih Tzu",jpg:"shih-tzu.jpg"},
  {n:"Spitz Allemand",jpg:"spitz-allemand.jpg"},
  {n:"Spitz Loup",jpg:"spitz-loup.jpg"},
  {n:"Staffordshire Bull Terrier",jpg:"staffordshire-bull-terrier.jpg"},
  {n:"Teckel",jpg:"teckel.jpg"},
  {n:"Terre-Neuve",jpg:"terre-neuve.jpg"},
  {n:"Welsh Corgi",jpg:"welsh-corgi.jpg"},
  {n:"Whippet",jpg:"whippet.jpg"},
  {n:"Yorkshire Terrier",jpg:"yorkshire-terrier.jpg"},
];

function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
const msg=p=>p===100?'🏆 Score parfait !':p>=80?'Excellent !':p>=60?'Bien joué !':p>=40?'Pas mal !':'Continue !';

function hearts(el,n,max=3){
  el.innerHTML='';
  for(let i=0;i<max;i++){
    const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('width','16');s.setAttribute('height','16');s.setAttribute('viewBox','0 0 24 24');
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z');
    p.setAttribute('fill',i<n?'#e8854a':'rgba(255,255,255,.2)');
    s.appendChild(p);el.appendChild(s);
  }
}

let _ac=null;
function getAC(){if(!_ac)try{_ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}return _ac;}
function playOk(){const ac=getAC();if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.setValueAtTime(880,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.start(t);o.stop(t+.3);}
function playErr(){const ac=getAC();if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.setValueAtTime(300,t);o.frequency.linearRampToValueAtTime(200,t+.18);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.14,t+.02);g.gain.linearRampToValueAtTime(0,t+.28);o.start(t);o.stop(t+.3);}

let data=[],queue=[],idx=0,score=0,streak=0,lives=3;

function resetGame(){
  data=[...CHIENS];queue=shuf(data);idx=0;score=0;streak=0;lives=3;
  document.getElementById('end').classList.remove('on');
  document.getElementById('game').style.display='';
  updHUD();showQ();
}

function updHUD(){
  hearts(document.getElementById('hearts'),lives);
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak>=3?'🔥 ×'+streak:'';
  document.getElementById('prog').style.width=(queue.length?idx/queue.length*100:0)+'%';
}

function showQ(){
  if(idx>=queue.length||lives<=0){endGame();return;}
  const q=queue[idx];
  document.getElementById('fb').className='fb';
  document.getElementById('nbtn').classList.remove('on');
  const imgEl=document.getElementById('animal-img');
  const ph=document.getElementById('animal-ph');
  imgEl.style.display='none';ph.style.display='block';ph.textContent='🐶';
  imgEl.onload=()=>{imgEl.style.display='block';ph.style.display='none';};
  imgEl.onerror=()=>{ph.textContent='🐶';imgEl.style.display='none';};
  imgEl.src=IMGP+q.jpg;
  const pool=shuf(data.filter(o=>o.n!==q.n));
  const opts=shuf([q.n,...pool.slice(0,3).map(o=>o.n)]);
  const div=document.getElementById('choices');div.innerHTML='';
  opts.forEach(name=>{
    const b=document.createElement('button');b.className='choice';b.textContent=name;
    b.onclick=()=>evalQ(b,name,q);div.appendChild(b);
  });
}

function evalQ(btn,chosen,q){
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  const ok=chosen===q.n;
  btn.classList.add(ok?'cor':'wrg');
  if(!ok){document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===q.n)b.classList.add('cor');});lives--;streak=0;playErr();}
  else{score++;streak++;playOk();}
  const fb=document.getElementById('fb');
  fb.className='fb '+(ok?'cor':'wrg');
  fb.innerHTML=ok?'<div class="fb-main">✓ '+q.n+'</div>':'<div class="fb-main">✗ C\'était : '+q.n+'</div>';
  idx++;updHUD();document.getElementById('nbtn').classList.add('on');
}

function nextQ(){showQ();}

function endGame(){
  document.getElementById('game').style.display='none';
  const played=idx,pct=played?Math.round(score/played*100):0;
  document.getElementById('escore').textContent=score+' / '+played;
  document.getElementById('epct').textContent=pct+'% de bonnes réponses';
  document.getElementById('emsg').textContent=msg(pct);
  document.getElementById('end').classList.add('on');
}

function doShare(){
  const text='🐶 Races de chiens\n'+document.getElementById('escore').textContent;
  if(navigator.share&&location.protocol==='https:'){navigator.share({title:'Quiz',text}).catch(()=>copyFallback(text));return;}
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>{const t=document.getElementById('toast');t.textContent='✓ Copié !';setTimeout(()=>t.textContent='',2500);}).catch(()=>copyFallback(text));return;}
  copyFallback(text);
}
function copyFallback(text){const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);const t=document.getElementById('toast');t.textContent='✓ Copié !';setTimeout(()=>t.textContent='',2500);}

resetGame();
</script>
</body>
</html>
