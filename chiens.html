<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Races de Chiens</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--orange:#d4601a;--orange-mid:#e8854a;--brown:#7a3b10;--ok:#3a6b2a;--ok-bg:#dff0d4;--ko:#9b2a1a;--ko-bg:#fde8e0;--r:12px;--rs:8px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;color:#fdf6ee;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:.75rem .75rem 1.5rem;
  background:radial-gradient(ellipse 120% 60% at 30% 20%,rgba(196,82,18,0) 0%,#7a3b10 45%,#4a2008 100%),linear-gradient(160deg,#a04010 0%,#6a2e08 40%,#3a1804 100%)}

/* NAV */
.nav{width:100%;max-width:540px;display:flex;align-items:center;gap:10px;margin-bottom:.75rem}
.back{font-size:.8rem;color:rgba(253,246,238,.6);text-decoration:none}.back:hover{color:#fdf6ee}
.hdr{text-align:center;flex:1}
.hdr h1{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:400;color:#fdf6ee}
.hdr h1 em{font-style:italic;color:var(--orange-mid)}

/* HUD */
.hud-row{display:flex;gap:6px;margin-bottom:.4rem;align-items:center;width:100%;max-width:540px}
.hud-lives{display:flex;gap:4px}
.hud-score{font-size:.78rem;color:rgba(253,246,238,.6);white-space:nowrap}
.hud-score strong{color:#fdf6ee;font-weight:500}
.hud-streak{font-size:.75rem;color:var(--orange-mid);font-weight:500;white-space:nowrap;margin-left:auto}
.prog{height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;margin-bottom:.5rem;width:100%;max-width:540px}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--orange-mid),#f0a060);border-radius:2px;transition:width .4s ease}

/* MODE SELECTOR */
.mode-wrap{display:flex;gap:6px;width:100%;max-width:540px;margin-bottom:.5rem}
.mode-btn{flex:1;padding:6px 8px;border-radius:20px;border:1.5px solid rgba(255,255,255,.2);background:rgba(0,0,0,.2);font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:500;color:rgba(253,246,238,.7);cursor:pointer;transition:all .15s;white-space:nowrap}
.mode-btn.active{background:var(--orange);color:white;border-color:var(--orange)}
.mode-btn:not(.active):hover{background:rgba(255,255,255,.12);color:#fdf6ee}

/* PANEL */
.panel{width:100%;max-width:540px}

/* QUESTION CARD */
.qcard{background:rgba(255,255,255,.97);border-radius:var(--r);border:none;margin-bottom:.4rem;position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(42,26,14,.35)}
.qcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brown),var(--orange),var(--orange-mid),var(--orange),var(--brown))}

/* PHOTO */
.photo-wrap{width:100%;min-height:180px;background:#7a3b10;display:flex;align-items:center;justify-content:center}
.photo-wrap img{max-width:100%;max-height:220px;width:auto;height:auto;display:block;object-fit:contain}

/* TRAITS (shown after answer) */
.traits-wrap{padding:.5rem .9rem .65rem;display:none}
.traits-wrap.on{display:block;animation:slin .25s ease}
.traits-race{font-family:'Playfair Display',serif;font-size:1rem;font-weight:400;color:#2a1a0e;margin-bottom:.4rem}
.traits-grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
.trait-row{display:flex;flex-direction:column;gap:.14rem}
.trait-label{font-size:.57rem;letter-spacing:.13em;text-transform:uppercase;color:#a07850;font-weight:500}
.trait-dots{display:flex;gap:3px}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid #d4b896;background:transparent}
.dot.on{background:var(--orange);border-color:var(--orange)}
.rarete-tag{display:inline-block;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;padding:.15rem .5rem;border-radius:20px;font-weight:500;margin-bottom:.35rem}
.rt-tf{background:#dff0d4;color:#3a6b2a}
.rt-f{background:#dbeeff;color:#1a4a7a}
.rt-m{background:#fff4d4;color:#7a5a10}
.rt-r{background:#ffe8d4;color:#8a3a10}
.rt-tr{background:#fde8e0;color:#9b2a1a}

/* CHOICES */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:.5rem}
.choice{padding:.55rem .7rem;border-radius:var(--rs);border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:400;color:#fdf6ee;text-align:center;line-height:1.3;transition:border-color .14s,background .14s}
.choice:not([disabled]):hover{border-color:var(--orange-mid);background:rgba(232,133,74,.25)}
.choice.cor{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:500}
.choice.wrg{background:var(--ko-bg);border-color:var(--ko);color:var(--ko)}
.choice[disabled]{cursor:default}

/* FEEDBACK */
.fb{border-radius:var(--rs);padding:.5rem .8rem;font-size:.8rem;line-height:1.4;margin-top:.4rem;display:none;animation:slin .2s ease}
@keyframes slin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fb.cor{background:var(--ok-bg);color:var(--ok);display:block}
.fb.wrg{background:var(--ko-bg);color:var(--ko);display:block}
.fb-main{font-weight:500}.fb-line{opacity:.75;margin-top:2px;font-size:.78rem}

/* NEXT BTN */
.nbtn{width:100%;margin-top:.4rem;padding:8px;border-radius:var(--rs);border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;cursor:pointer;color:rgba(253,246,238,.85);transition:all .18s;display:none}
.nbtn.on{display:block}.nbtn:hover{background:var(--orange);color:white;border-color:var(--orange)}

/* END */
.end{background:rgba(255,255,255,.97);border-radius:var(--r);border:none;box-shadow:0 4px 28px rgba(42,26,14,.4);padding:2.25rem 1.75rem;text-align:center;display:none;position:relative;overflow:hidden;width:100%;max-width:540px}
.end::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brown),var(--orange),var(--orange-mid),var(--orange),var(--brown))}
.end.on{display:block;animation:slin .3s ease}
.end-eye{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--orange);font-weight:500;margin-bottom:.55rem}
.end-score{font-family:'Playfair Display',serif;font-size:3rem;font-weight:400;color:#2a1a0e;line-height:1}
.end-pct{font-size:.88rem;color:#a07850;margin-top:.4rem}
.end-msg{font-size:.86rem;color:#5c3a1e;margin-top:.55rem}
.rbtn{margin-top:1.4rem;padding:10px 24px;border-radius:40px;background:var(--orange);color:white;border:none;font-family:'DM Sans',sans-serif;font-size:.84rem;font-weight:500;cursor:pointer;transition:background .18s}
.rbtn:hover{background:var(--brown)}
.share-btn{display:inline-flex;align-items:center;gap:5px;padding:9px 18px;border-radius:40px;background:var(--brown);color:white;border:none;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;cursor:pointer}
.share-btn:hover{background:#5a2a08}
.share-toast{font-size:.74rem;color:var(--ok);margin-top:.4rem;min-height:.9rem;text-align:center}
</style>
</head>

<div class="nav">
  <a class="back" href="index.html">← Accueil</a>
  <div class="hdr"><h1>🐕 <em>Races de Chiens</em></h1></div>
</div>

<div class="hud-row">
  <div class="hud-score">Score&thinsp;: <strong id="score">0</strong></div>
  <div class="hud-streak" id="streak"></div>
</div>
<div class="prog"><div class="prog-fill" id="prog" style="width:0%"></div></div>

</div>

<div class="panel" id="game">

        <div class="trait-row"><div class="trait-label">Sportif</div><div class="trait-dots" id="d-spo"></div></div>
      </div>
    </div>
  </div>
  <div class="choices" id="choices"></div>
  <div class="fb" id="fb"></div>
  <button class="nbtn" id="nbtn" onclick="next()">Question suivante →</button>
</div>

<div class="end" id="end">
  <div class="end-eye">Partie terminée</div>
  <div class="end-score" id="escore"></div>
  <div class="end-pct" id="epct"></div>
  <div class="end-msg" id="emsg"></div>
  <div style="display:flex;gap:8px;justify-content:center;margin-top:1.4rem">
    <button class="rbtn" onclick="resetGame()">Rejouer</button>
    <button class="share-btn" onclick="doShare()">⬆ Partager</button>
  </div>
  <div class="share-toast" id="toast"></div>
</div>

const shuf = a => [...a].sort(()=>Math.random()-.5);
const msg = p => p===100?'🏆 Score parfait !':p>=80?'Excellent !':p>=60?'Bien joué !':p>=40?'Pas mal !':'Continue à t\'entraîner !';

const RARETE_CFG = {
  'Très fréquent': {cls:'rt-tf', label:'⭐ Très fréquent'},
  'Fréquent':      {cls:'rt-f',  label:'Fréquent'},
  'Moyennement fréquent': {cls:'rt-m', label:'Moyen'},
  'Rare':          {cls:'rt-r',  label:'Rare'},
  'Très rare':     {cls:'rt-tr', label:'Très rare'},
};

let currentMode = 'frequent';
let queue=[], idx=0, score=0, streak=0, lives=3;

function getList() {
  if(currentMode==='frequent') return DOGS.filter(d=>['Très fréquent','Fréquent','Moyennement fréquent'].includes(d.rarete));
  if(currentMode==='rare')     return DOGS.filter(d=>['Rare','Très rare'].includes(d.rarete));
  return DOGS;
}

function setMode(m) {
  currentMode = m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode===m));
  resetGame();
}

function hearts(el, n, max=3) {
  el.innerHTML='';
  for(let i=0;i<max;i++){
    const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('width','16');s.setAttribute('height','16');s.setAttribute('viewBox','0 0 24 24');
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z');
    p.setAttribute('fill',i<n?'#e8854a':'rgba(255,255,255,.2)');
    s.appendChild(p);el.appendChild(s);
  }
}

const AC = new(window.AudioContext||window.webkitAudioContext)();
function playOk(){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type='sine';o.frequency.setValueAtTime(880,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.start(t);o.stop(t+.3)}
function playErr(){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type='sine';o.frequency.setValueAtTime(300,t);o.frequency.linearRampToValueAtTime(200,t+.18);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.14,t+.02);g.gain.linearRampToValueAtTime(0,t+.28);o.start(t);o.stop(t+.3)}

function makeDots(id, val) {
  const el=document.getElementById(id); el.innerHTML='';
  for(let i=1;i<=5;i++){const d=document.createElement('div');d.className='dot'+(i<=val?' on':'');el.appendChild(d);}
}

function resetGame() {
  queue=shuf(getList()); idx=0; score=0; streak=0; lives=3;
  document.getElementById('end').classList.remove('on');
  document.getElementById('game').style.display='';
  updHUD(); showQ();
}

function updHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('streak').textContent = streak>=3?'× '+streak+' en série':'';
  document.getElementById('prog').style.width = (queue.length ? idx/queue.length*100 : 0)+'%';
}

function showQ() {
  if(idx>=queue.length || lives<=0){endGame();return}
  const q = queue[idx];

  // Photo
  document.getElementById('dog-photo').src = PHOTO_DIR + q.fichier;
  document.getElementById('traits-wrap').className = 'traits-wrap';
  document.getElementById('fb').className = 'fb';
  document.getElementById('nbtn').classList.remove('on');

  // 4 choices: correct + 3 random from same list
  const pool = shuf(queue.filter(d=>d.nom!==q.nom));
  const opts = shuf([q, ...pool.slice(0,3)]);

  const div = document.getElementById('choices'); div.innerHTML='';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = o.nom;
    b.onclick = () => evalQ(b, o.nom, q);
    div.appendChild(b);
  });
}

function evalQ(btn, chosen, q) {
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  const ok = chosen === q.nom;

  btn.classList.add(ok?'cor':'wrg');
  if(!ok) {
    document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===q.nom)b.classList.add('cor');});
    lives--; streak=0; playErr();
  } else {
    score++; streak++; playOk();
  }

  // Show traits
  document.getElementById('traits-race').textContent = q.nom;
  makeDots('d-aff', q.affectueux);
  makeDots('d-int', q.intelligent);
  makeDots('d-obe', q.obeissant);
  makeDots('d-spo', q.sportif);
  document.getElementById('traits-wrap').className='traits-wrap on';

  // Feedback
  const fb=document.getElementById('fb');
  fb.className='fb '+(ok?'cor':'wrg');
  fb.innerHTML = ok
    ? `<div class="fb-main">✓ Bien joué !</div>`
    : `<div class="fb-main">✗ C'était : <strong>${q.nom}</strong></div>`;

  idx++; updHUD();
  document.getElementById('nbtn').classList.add('on');
}

function next(){showQ()}

function endGame() {
  document.getElementById('game').style.display='none';
  const played=idx, pct=played?Math.round(score/played*100):0;
  document.getElementById('escore').textContent=score+' / '+played;
  document.getElementById('epct').textContent=pct+'% de bonnes réponses';
  document.getElementById('emsg').textContent=msg(pct);
  document.getElementById('end').classList.add('on');
}

function doShare() {
  const sc=document.getElementById('escore').textContent;
  const modeLabel={'frequent':'Fréquents','rare':'Rares','all':'Tous'}[currentMode]||'';
  const text='🐕 Quiz Chiens — '+modeLabel+'\n'+sc;
  const toast=document.getElementById('toast');
  if(navigator.share&&location.protocol==='https:'){navigator.share({title:'Quiz Chiens',text}).catch(()=>showModal(text));return}
  if(navigator.clipboard&&(location.protocol==='https:'||location.hostname==='localhost')){
    navigator.clipboard.writeText(text).then(()=>{toast.textContent='✓ Copié !';setTimeout(()=>toast.textContent='',2500)}).catch(()=>showModal(text));return;
  }
  showModal(text);
}

function showModal(text) {
  let m=document.getElementById('share-modal');
  if(!m){m=document.createElement('div');m.id='share-modal';m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:999;padding:1rem';
  m.innerHTML='<div style="background:white;border-radius:12px;padding:1.5rem;max-width:300px;width:100%;text-align:center;font-family:DM Sans,sans-serif;color:#2a1a0e"><textarea id="share-text" readonly style="width:100%;border:1.5px solid #e8d5b8;border-radius:8px;padding:.75rem;font-size:1rem;line-height:1.8;text-align:center;resize:none;background:#fdf6ee;color:#2a1a0e;font-family:inherit"></textarea><button onclick="document.getElementById(\'share-text\').select();document.execCommand(\'copy\')" style="margin-top:.75rem;padding:8px 20px;border-radius:40px;background:#d4601a;color:white;border:none;font-size:.84rem;font-weight:500;cursor:pointer">Copier</button><div><button onclick="document.getElementById(\'share-modal\').style.display=\'none\'" style="margin-top:.75rem;background:none;border:none;color:#a07850;font-size:.8rem;cursor:pointer">Fermer</button></div></div>';
  document.body.appendChild(m);}
  m.style.display='flex';
  const ta=document.getElementById('share-text');ta.value=text;ta.rows=text.split('\n').length+1;
}

resetGame();
</script>
