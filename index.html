<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;color:#fdf6ee;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1.5rem 1rem 2rem;
  background:radial-gradient(ellipse 120% 60% at 30% 20%,rgba(196,82,18,0) 0%,#7a3b10 45%,#4a2008 100%),
             linear-gradient(160deg,#a04010 0%,#6a2e08 40%,#3a1804 100%)}
.hdr{text-align:center;margin-bottom:1.5rem}
.hdr h1{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,6vw,2.8rem);font-weight:400}
.hdr h1 em{font-style:italic;color:#e8854a}

/* MOT DU JOUR */
.mot-du-jour{width:100%;max-width:480px;margin-bottom:1.25rem;
  background:rgba(255,255,255,.1);backdrop-filter:blur(6px);
  border:1.5px solid rgba(255,255,255,.2);border-radius:14px;
  padding:1rem 1.25rem}
.mdj-label{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;
  color:#e8854a;font-weight:500;margin-bottom:.25rem}
.mdj-date{font-size:.72rem;color:rgba(253,246,238,.5);margin-bottom:.6rem}
.mdj-mot{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:400;
  color:#fdf6ee;margin-bottom:.35rem}
.mdj-def{font-size:.8rem;color:rgba(253,246,238,.75);line-height:1.5;font-style:italic}
.mdj-loading{font-size:.8rem;color:rgba(253,246,238,.4);font-style:italic}

/* GRILLE */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:480px}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:1.2rem .75rem;border-radius:14px;
  border:1.5px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.09);backdrop-filter:blur(4px);
  text-decoration:none;color:#fdf6ee;
  transition:background .18s,transform .15s}
.card:active{transform:scale(.96)}
.card-emoji{font-size:1.9rem;line-height:1}
.card-label{font-size:.82rem;font-weight:500;text-align:center;line-height:1.2}
</style>
</head>
<body>
<div class="hdr">
  <h1>Le <em>Quiz</em></h1>
</div>

<!-- MOT DU JOUR -->
<div class="mot-du-jour">
  <div class="mdj-label">✦ Mot du jour</div>
  <div class="mdj-date" id="mdj-date"></div>
  <div class="mdj-mot" id="mdj-mot"><span class="mdj-loading">Chargement…</span></div>
  <div class="mdj-def" id="mdj-def"></div>
</div>

<div class="grid">
  <a class="card" href="capitales.html"><div class="card-emoji">🌍</div><div class="card-label">Capitales</div></a>
  <a class="card" href="departements.html"><div class="card-emoji">🗺️</div><div class="card-label">Départements</div></a>
  <a class="card" href="chansons.html"><div class="card-emoji">🎵</div><div class="card-label">Chansons</div></a>
  <a class="card" href="fromages.html"><div class="card-emoji">🧀</div><div class="card-label">Fromages</div></a>
  <a class="card" href="vins.html"><div class="card-emoji">🍷</div><div class="card-label">Vins</div></a>
  <a class="card" href="oiseaux.html"><div class="card-emoji">🐦</div><div class="card-label">Oiseaux</div></a>
  <a class="card" href="champignons.html"><div class="card-emoji">🍄</div><div class="card-label">Champignons</div></a>
  <a class="card" href="cris.html"><div class="card-emoji">🦁</div><div class="card-label">Cris d'animaux</div></a>
  <a class="card" href="films.html"><div class="card-emoji">🎬</div><div class="card-label">Films</div></a>
  <a class="card" href="chiens.html"><div class="card-emoji">🐶</div><div class="card-label">Chiens</div></a>
  <a class="card" href="choisir_chien.html"><div class="card-emoji">🏆</div><div class="card-label">Choisir son chien</div></a>
  <a class="card" href="compte_est_bon.html"><div class="card-emoji">🔢</div><div class="card-label">Le Compte est Bon</div></a>
  <a class="card" href="kenken.html"><div class="card-emoji">🔣</div><div class="card-label">KenKen</div></a>
</div>

<script>
const today = new Date();
const jours = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
document.getElementById('mdj-date').textContent =
  jours[today.getDay()] + ' ' + today.getDate() + ' ' + mois[today.getMonth()] + ' ' + today.getFullYear();

const ref = new Date(2026, 4, 26);
const diffMs = today - ref;
const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

fetch('Mots rares/mots.json')
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(mots => {
    const idx = ((diffDays % mots.length) + mots.length) % mots.length;
    document.getElementById('mdj-mot').textContent = mots[idx][0];
    document.getElementById('mdj-def').textContent = mots[idx][1];
  })
  .catch(() => {
    document.getElementById('mdj-mot').textContent = 'Indisponible';
    document.getElementById('mdj-def').textContent = '';
  });
</script>
</body>
</html>
