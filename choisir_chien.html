<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choisir son Chien</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--orange:#d4601a;--orange-mid:#e8854a;--brown:#7a3b10;--r:12px;--rs:8px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;color:#fdf6ee;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:.75rem .75rem 1.5rem;
  background:radial-gradient(ellipse 120% 60% at 30% 20%,rgba(196,82,18,0) 0%,#7a3b10 45%,#4a2008 100%),linear-gradient(160deg,#a04010 0%,#6a2e08 40%,#3a1804 100%)}

/* NAV */
.nav{width:100%;max-width:540px;display:flex;align-items:center;gap:10px;margin-bottom:.75rem}
.back{font-size:.8rem;color:rgba(253,246,238,.6);text-decoration:none}.back:hover{color:#fdf6ee}
.hdr{text-align:center;flex:1}
.hdr h1{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:400;color:#fdf6ee}
.hdr h1 em{font-style:italic;color:var(--orange-mid)}

/* ROUND INFO */
.round-info{width:100%;max-width:540px;display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;font-size:.75rem;color:rgba(253,246,238,.6)}
.round-info strong{color:#fdf6ee}
.prog{height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;margin-bottom:.6rem;width:100%;max-width:540px}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--orange-mid),#f0a060);border-radius:2px;transition:width .4s ease}

/* ÉCRAN CHOIX DE LISTE */
.screen{width:100%;max-width:540px;display:none}
.screen.on{display:block;animation:slin .25s ease}
@keyframes slin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.list-card{background:rgba(255,255,255,.97);border-radius:var(--r);padding:1.6rem 1.4rem;text-align:center;box-shadow:0 4px 20px rgba(42,26,14,.35);position:relative;overflow:hidden}
.list-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brown),var(--orange),var(--orange-mid),var(--orange),var(--brown))}
.list-title{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:400;color:#2a1a0e;margin-bottom:.3rem}
.list-title em{font-style:italic;color:var(--orange)}
.list-sub{font-size:.8rem;color:#a07850;margin-bottom:1.2rem}
.list-btns{display:flex;flex-direction:column;gap:.6rem}
.list-btn{padding:.75rem 1rem;border-radius:var(--rs);border:1.5px solid rgba(212,96,26,.35);background:transparent;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:500;color:var(--orange);cursor:pointer;transition:all .18s;text-align:left;display:flex;justify-content:space-between;align-items:center}
.list-btn:hover{background:var(--orange);color:white;border-color:var(--orange)}
.list-btn span{font-size:.75rem;opacity:.6;font-weight:400}

/* DUEL — layout selon schéma v4 */
.duel-wrap{width:100%;max-width:540px;border-radius:var(--r);overflow:hidden;
  box-shadow:0 4px 16px rgba(42,26,14,.3);margin-bottom:.5rem;
  background:#5c2a08;position:relative}
.duel-wrap::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--brown),var(--orange-mid),var(--brown));z-index:1}

/* Rangée noms : nom A centré sur photo A, nom B centré sur photo B, zone C invisible */
.duel-names{display:flex}
.duel-name-a{flex:1;font-family:'Playfair Display',serif;font-size:.82rem;
  font-weight:400;color:#fdf6ee;padding:.4rem .5rem .3rem;text-align:center;
  cursor:pointer;border-bottom:1px solid rgba(255,255,255,.1)}
.duel-name-c{width:160px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.1)}
.duel-name-b{flex:1;font-family:'Playfair Display',serif;font-size:.82rem;
  font-weight:400;color:#fdf6ee;padding:.4rem .5rem .3rem;text-align:center;
  cursor:pointer;border-bottom:1px solid rgba(255,255,255,.1)}

/* Corps principal : photo A | zone C | photo B */
.duel-body{display:flex}

/* Photos — flex:1, descendent jusqu'en bas */
.duel-photo{flex:1;background:var(--brown);display:flex;align-items:center;
  justify-content:center;min-height:150px;cursor:pointer}
.duel-photo img{max-width:100%;height:auto;display:block;object-fit:contain}
.duel-photo.winner{outline:3px solid #3a6b2a}
.duel-photo.loser{opacity:.3;filter:grayscale(.5);pointer-events:none}

/* Zone C — largeur fixe 160px */
.duel-zone-c{width:160px;flex-shrink:0;display:flex;flex-direction:column;background:#4a2208}

/* Carac — prend l'espace disponible */
.duel-carac{flex:1;padding:.35rem .3rem .2rem}
.carac-item{margin-bottom:0}
.carac-label{font-size:.48rem;letter-spacing:.12em;text-transform:uppercase;
  color:#c8884a;font-weight:500;text-align:center;display:block;margin-bottom:.15rem;margin-top:.65rem}
.carac-item:first-child .carac-label{margin-top:0}
.carac-dots-row{display:flex;align-items:center;justify-content:center;gap:0}
.carac-dots-left{display:flex;flex-direction:row-reverse;gap:2px;padding-right:6px}
.carac-sep{color:rgba(253,246,238,.3);font-size:.65rem;flex-shrink:0;line-height:1;padding:0 2px}
.carac-dots-right{display:flex;gap:2px;padding-left:6px}
.dot{width:7px;height:7px;border-radius:50%;border:1.2px solid rgba(255,255,255,.2);
  background:transparent;flex-shrink:0}
.dot.on{background:var(--orange-mid);border-color:var(--orange-mid)}

/* Boutons — centrés, espacés */
.duel-btns{display:flex;flex-direction:column;gap:8px;padding:.3rem .4rem .45rem;align-items:center}
.pick-btn{display:block;width:75%;padding:.4rem .2rem;
  border-radius:7px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);font-family:'DM Sans',sans-serif;
  font-size:.7rem;font-weight:500;color:rgba(253,246,238,.75);
  cursor:pointer;transition:all .18s;text-align:center;line-height:1.3}
.pick-btn:hover{background:rgba(255,255,255,.22);color:#fdf6ee}

/* Loser sur nom aussi */
.duel-name-a.loser,.duel-name-b.loser{opacity:.3;pointer-events:none}

/* NEXT DUEL BTN (shown after pick) */


/* RÉSULTAT FINAL */
.result-card{background:rgba(255,255,255,.97);border-radius:var(--r);padding:1.5rem 1.2rem;text-align:center;box-shadow:0 4px 28px rgba(42,26,14,.4);position:relative;overflow:hidden}
.result-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brown),var(--orange),var(--orange-mid),var(--orange),var(--brown))}
.result-eye{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--orange);font-weight:500;margin-bottom:.4rem}
.result-title{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:400;color:#2a1a0e;margin-bottom:.8rem}
.result-title em{font-style:italic;color:var(--orange)}
.result-photo{background:var(--brown);border-radius:8px;overflow:hidden;margin:0 auto .8rem;width:60%;display:flex;align-items:center;justify-content:center}
.result-photo img{max-width:100%;max-height:180px;width:auto;height:auto;display:block;object-fit:contain}
.result-name{font-family:'Playfair Display',serif;font-size:1.5rem;color:#2a1a0e;margin-bottom:.7rem}
.result-traits{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1.2rem;text-align:left}
.result-trait{display:flex;flex-direction:column;gap:.15rem}
.result-lbl{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:#a07850;font-weight:500}
.result-dots{display:flex;gap:3px}
.result-dot{width:11px;height:11px;border-radius:50%;border:1.5px solid #d4b896;background:transparent}
.result-dot.on{background:var(--orange);border-color:var(--orange)}
.restart-btn{padding:9px 22px;border-radius:40px;background:var(--orange);color:white;border:none;font-family:'DM Sans',sans-serif;font-size:.84rem;font-weight:500;cursor:pointer;transition:background .18s}
.restart-btn:hover{background:var(--brown)}

/* NO DOGS */
.no-dogs{background:rgba(255,255,255,.97);border-radius:var(--r);padding:1.8rem 1.4rem;text-align:center;box-shadow:0 4px 20px rgba(42,26,14,.35)}
.no-dogs p{color:#5c3a1e;font-size:.9rem;margin-bottom:1rem}
</style>
</head>

ichier": "grand_basset_griffon_vendeen.webp", "rarete": "Très rare", "affectueux": 2, "intelligent": 3, "obeissant": 2, "sportif": 4}];

const shuf = a => [...a].sort(()=>Math.random()-.5);

// ── State
let pool = [];        // chiens encore en lice ce tour
let duels = [];       // paires du tour courant [[a,b], ...]
let winners = [];     // gagnants du tour courant
let duelIdx = 0;
let roundNum = 1;
let picked = false;

function getList(mode) {
  if(mode==='frequent') return DOGS.filter(d=>['Très fréquent','Fréquent','Moyennement fréquent'].includes(d.rarete));
  if(mode==='rare')     return DOGS.filter(d=>['Rare','Très rare'].includes(d.rarete));
  return DOGS;
}

function startGame(mode) {
  pool = shuf(getList(mode));
  roundNum = 1; winners = [];
  buildDuels();
  showScreen('screen-duel');
  document.getElementById('survivors-count').textContent = pool.length;
  document.getElementById('round-info').style.display='flex';
  document.getElementById('prog-wrap').style.display='block';
  showDuel();
}

function buildDuels() {
  duels = [];
  // Dédoublonner par fichier pour éviter deux fois le même chien
  const seen = new Set();
  const p = shuf(pool.filter(d => {
    if(seen.has(d.fichier)) return false;
    seen.add(d.fichier); return true;
  }));
  // Si impair, réutiliser le dernier (pas le premier, pour varier)
  if(p.length % 2 === 1) p.push(p[p.length - 2] || p[0]);
  for(let i=0;i<p.length;i+=2) duels.push([p[i],p[i+1]]);
  duelIdx = 0;
  winners = [];
}

function showDuel() {
  picked = false;
  const [a, b] = duels[duelIdx];
  const wrap = document.getElementById('duel-wrap');
  wrap.innerHTML = dogCard(a, b);
  updHUD();
}

function nextDuel(){showDuel()}

function dogCard(a, b) {
  const carac = (lbl, va, vb) => `
    <div class="carac-item">
      <span class="carac-label">${lbl}</span>
      <div class="carac-dots-row">
        <div class="carac-dots-left">${dotsHtml(va)}</div>
        <span class="carac-sep">–</span>
        <div class="carac-dots-right">${dotsHtml(vb)}</div>
      </div>
    </div>`;

  return `
    <div class="duel-names">
      <div class="duel-name-a" onclick="pick(0)">${a.nom}</div>
      <div class="duel-name-c"></div>
      <div class="duel-name-b" onclick="pick(1)">${b.nom}</div>
    </div>
    <div class="duel-body">
      <div class="duel-photo" id="duel-photo-0" onclick="pick(0)">
        <img src="${PHOTO_DIR}${a.fichier}" alt="${a.nom}" loading="lazy">
      </div>
      <div class="duel-zone-c">
        <div class="duel-carac">
          ${carac('Affectueux', a.affectueux, b.affectueux)}
          ${carac('Intelligent', a.intelligent, b.intelligent)}
          ${carac('Obéissant',  a.obeissant,  b.obeissant)}
          ${carac('Sportif',    a.sportif,    b.sportif)}
        </div>
        <div class="duel-btns">
          <button class="pick-btn" onclick="pickNone()">Aucun des deux</button>
          <button class="pick-btn" onclick="pickBoth()">Les deux !</button>
        </div>
      </div>
      <div class="duel-photo" id="duel-photo-1" onclick="pick(1)">
        <img src="${PHOTO_DIR}${b.fichier}" alt="${b.nom}" loading="lazy">
      </div>
    </div>`;
}

function dotsHtml(val) {
  let h='';
  for(let i=1;i<=5;i++) h+=`<div class="dot${i<=val?' on':''}"></div>`;
  return h;
}

function updateSurvivors(delta) {
  const el = document.getElementById('survivors-count');
  el.textContent = Math.max(0, parseInt(el.textContent) + delta);
}

function pick(idx) {
  if(picked) return;
  picked = true;
  const photos = document.getElementById('duel-wrap').querySelectorAll('.duel-photo');
  const names  = [document.querySelector('.duel-name-a'), document.querySelector('.duel-name-b')];
  photos[idx].classList.add('winner');
  photos[1-idx].classList.add('loser');
  if(names[1-idx]) names[1-idx].classList.add('loser');
  winners.push(duels[duelIdx][idx]);
  hideBtns();
  updateSurvivors(-1);
  duelIdx++;
  updHUD();
  setTimeout(() => advanceAfterPick(), 600);
}

function pickBoth() {
  if(picked) return;
  picked = true;
  const add = (d) => { if(!winners.find(w=>w.fichier===d.fichier)) winners.push(d); };
  add(duels[duelIdx][0]);
  add(duels[duelIdx][1]);
  document.getElementById('duel-wrap').querySelectorAll('.duel-photo').forEach(p=>p.classList.add('winner'));
  hideBtns();
  duelIdx++;
  updHUD();
  setTimeout(() => advanceAfterPick(), 600);
}

function hideBtns() {
  const btns = document.querySelector('.duel-btns');
  if(btns) btns.style.visibility='hidden';
}

function pickNone() {
  if(picked) return;
  picked = true;
  document.getElementById('duel-wrap').querySelectorAll('.duel-photo').forEach(p=>p.classList.add('loser'));
  hideBtns();
  updateSurvivors(-2);
  duelIdx++;
  updHUD();
  setTimeout(() => advanceAfterPick(), 600);
}

function resetSurvivorsDisplay() {
  document.getElementById('survivors-count').textContent = pool.length;
}

function advanceAfterPick() {
  if(duelIdx < duels.length) {
    showDuel();
    return;
  }
  // Fin du tour
  if(winners.length === 0) {
    pool = shuf(pool);
    roundNum++;
    buildDuels();
    resetSurvivorsDisplay();
    showDuel();
  } else if(winners.length === 1) {
    showResult(winners[0]);
  } else if(winners.length >= pool.length) {
    if(pool.length <= 2) {
      pool = shuf(pool.length > 0 ? pool : winners);
      roundNum++;
      buildDuels();
      resetSurvivorsDisplay();
      showDuel();
    } else {
      pool = winners;
      roundNum++;
      buildDuels();
      resetSurvivorsDisplay();
      showDuel();
    }
  } else {
    pool = winners;
    roundNum++;
    buildDuels();
    resetSurvivorsDisplay();
    showDuel();
  }
}

function updHUD() {
  document.getElementById('round-num').textContent = roundNum;
  // survivors-count updated live by updateSurvivors()
  const pct = duels.length ? duelIdx/duels.length*100 : 0;
  document.getElementById('prog').style.width = pct+'%';
}

function showResult(dog) {
  document.getElementById('round-info').style.display='none';
  document.getElementById('prog-wrap').style.display='none';
  showScreen('screen-result');

  let dotsResult = (id,val) => {
    let h='';for(let i=1;i<=5;i++)h+=`<div class="result-dot${i<=val?' on':''}"></div>`;return h;
  };

  document.getElementById('result-card').innerHTML = `
    <div class="result-eye">Votre chien idéal</div>
    <div class="result-title">C'est le <em>${dog.nom}</em> !</div>
    <div class="result-photo"><img src="${PHOTO_DIR}${dog.fichier}" alt="${dog.nom}"></div>
    <div class="result-traits">
      <div class="result-trait"><div class="result-lbl">Affectueux</div><div class="result-dots">${dotsResult('',dog.affectueux)}</div></div>
      <div class="result-trait"><div class="result-lbl">Intelligent</div><div class="result-dots">${dotsResult('',dog.intelligent)}</div></div>
      <div class="result-trait"><div class="result-lbl">Obéissant</div><div class="result-dots">${dotsResult('',dog.obeissant)}</div></div>
      <div class="result-trait"><div class="result-lbl">Sportif</div><div class="result-dots">${dotsResult('',dog.sportif)}</div></div>
    </div>
    <button class="restart-btn" onclick="goHome()">Recommencer</button>
  `;
}

function goHome() {
  document.getElementById('round-info').style.display='none';
  document.getElementById('prog-wrap').style.display='none';
  showScreen('screen-list');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
</script>
</body>
</html>
